name: trapdoor-lab regression

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.8 已 EOL：ubuntu-latest（26.04）的 setup-python 不再提供 3.8，
      # 三次历史 run 均卡在此步（"version '3.8' ... not found for Ubuntu 26.04"）。
      # 改用 3.11；本机银河麒麟仍用 3.8（venv），两边依赖 pin 版本一致、结果互证。
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.24.4 scipy==1.10.1 matplotlib==3.7.5

      - name: Run full unittest suite (incl. frozen golden JSON)
        working-directory: trapdoor_lab
        run: python -m unittest discover -s tests -v

      - name: Run command-line self-check
        working-directory: trapdoor_lab
        run: python 自检.py

      - name: Compile all modules
        working-directory: trapdoor_lab
        run: python -m py_compile app.py collapse_kernel.py plots.py l2_shooting.py l3_rate.py gtt.py benchmarks.py collapse_anim.py
